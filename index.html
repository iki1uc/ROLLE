<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ROLLE · 6 Rollen · SEED ⟁</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:40px; }
h1 { color:#6cf; }
pre { background:#111; padding:20px; border-left:3px solid #6cf; }

#frame {
    width: 360px;
    height: 360px;
    margin: 40px auto;
    border: 3px solid #6cf;
    border-radius: 12px;
}
</style>
</head>

<body>

<h1>ROLLE · 6 Rollen · FRAME</h1>
<div id="frame"></div>

<pre id="out">Lade ROLLE…</pre>

<script>
// =========================
//  SEED · Ursprung
// =========================
const SEED = "⟁";

// =========================
//  ROLLE · 6 Rollen in EINEM Objekt
// =========================
const ROLLE = {
    id: SEED,

    ort:  { desc: "Ort der Rolle", value: "local" },
    home: { desc: "Heim-Rolle",    value: "root" },
    user: { desc: "Benutzerrolle", value: "active" },
    use:  { desc: "Nutzung",       value: "direct" },
    out:  { desc: "Ausgabe",       value: "visible" },
    rolle:{ desc: "Rollenkern",    value: "single" }
};

// =========================
//  Ausgabe
// =========================
document.getElementById("out").textContent =
    JSON.stringify(ROLLE, null, 2);
</script>

</body>
</html>
